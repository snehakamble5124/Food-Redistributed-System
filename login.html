<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FoodRedist</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-page">
  <div class="login-card">
    <h2>&#127860; FoodRedist</h2>
    <p class="subtitle">Distributed Food Waste Redistribution</p>

    <div class="login-toggle">
      <button id="tab-login" class="active" onclick="showForm('login')">Login</button>
      <button id="tab-register" onclick="showForm('register')">Register</button>
    </div>

    <form id="login-form" class="login-form active" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" class="form-control" id="login-email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" class="form-control" id="login-password" required placeholder="Enter password">
      </div>
<div class="form-group">
        <label>Role</label>
        <select class="form-control" id="reg-role" required>
          <option value="donor">Donor</option>
          <option value="ngo">NGO</option>
          <option value="volunteer">Volunteer</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:0.7rem;" id="login-btn">Login</button>
    </form>

    <form id="register-form" class="login-form" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" class="form-control" id="reg-name" required placeholder="John Doe">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" class="form-control" id="reg-email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" class="form-control" id="reg-password" required minlength="4" placeholder="Min 4 characters">
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="tel" class="form-control" id="reg-phone" required placeholder="+1 234 567 890">
      </div>
      <div class="form-group">
        <label>Location (Address)</label>
        <input type="text" class="form-control" id="reg-address" required placeholder="e.g. 124 Green Street, New York, NY">
        <small class="text-muted" id="geo-status">Coordinates are auto-detected for proximity matching.</small>
        <input type="hidden" id="reg-lat">
        <input type="hidden" id="reg-lng">
      </div>
      <button type="submit" class="btn btn-orange" style="width:100%;justify-content:center;padding:0.7rem;" id="reg-btn">Create Account</button>
    </form>
  </div>
</div>

<script src="js/app.js?v=2"></script>
<script>
  function showForm(form) {
    document.getElementById('login-form').classList.toggle('active', form === 'login');
    document.getElementById('register-form').classList.toggle('active', form === 'register');
    document.getElementById('tab-login').classList.toggle('active', form === 'login');
    document.getElementById('tab-register').classList.toggle('active', form === 'register');
  }

  if (window.location.hash === '#register') showForm('register');

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        document.getElementById('reg-lat').value = pos.coords.latitude.toFixed(6);
        document.getElementById('reg-lng').value = pos.coords.longitude.toFixed(6);
        document.getElementById('geo-status').textContent = 'Location detected for proximity matching';
        document.getElementById('geo-status').style.color = '#2d6a4f';
      },
      () => {
        document.getElementById('geo-status').textContent = 'Could not auto-detect location.';
        document.getElementById('geo-status').style.color = '#e76f51';
      }
    );
  }

  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Logging in...';
    try {
      const res = await apiCall('POST', API.USER + '/users/login', {
        email: document.getElementById('login-email').value,
        password: document.getElementById('login-password').value,
      });
      setUser({
        id: res.user_id, name: res.name, email: document.getElementById('login-email').value,
        role: res.role, token: res.token, address: res.address, latitude: res.latitude, longitude: res.longitude,
      });
      showAlert('Login successful!', 'success');
      redirectByRole(res.role);
    } catch (err) {
      showAlert(err.message || 'Login failed', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Login';
    }
  }

  async function handleRegister(e) {
    e.preventDefault();
    const btn = document.getElementById('reg-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Creating account...';
    try {
      const payload = {
        name: document.getElementById('reg-name').value,
        email: document.getElementById('reg-email').value,
        password: document.getElementById('reg-password').value,
        phone: document.getElementById('reg-phone').value,
        role: document.getElementById('reg-role').value,
        address: document.getElementById('reg-address').value,
        latitude: parseFloat(document.getElementById('reg-lat').value) || 0,
        longitude: parseFloat(document.getElementById('reg-lng').value) || 0,
      };
      const res = await apiCall('POST', API.USER + '/users/register', payload);
      setUser({
        id: res.user_id, name: payload.name, email: payload.email, role: payload.role,
        token: res.token, address: res.address, latitude: payload.latitude, longitude: payload.longitude,
      });
      showAlert('Registration successful!', 'success');
      redirectByRole(payload.role);
    } catch (err) {
      showAlert(err.message || 'Registration failed', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Create Account';
    }
  }

  function redirectByRole(role) {
    const map = { DONOR: 'donor.html', NGO: 'ngo.html', VOLUNTEER: 'volunteer.html', ADMIN: 'admin.html', donor: 'donor.html', ngo: 'ngo.html', volunteer: 'volunteer.html', admin: 'admin.html' };
    window.location.href = map[role] || 'index.html';
  }
</script>
</body>
</html>
